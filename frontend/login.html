<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Sign in to your SkillSwap account.">
    <meta name="theme-color" content="#07151c">
    <title>Sign in — SkillSwap</title>
    <link rel="stylesheet" href="css/login.css">
    <script src="js/api.js?v=2" defer></script>
    <script src="js/login.js?v=2" defer></script>
  </head>
  <body class="login-page">
    <a class="skip-link" href="#login-title">Skip to sign in</a>

    <main class="login-shell" id="main" aria-label="SkillSwap sign in">
      <section class="login-visual" aria-labelledby="visual-title">
        <div class="visual-overlay" aria-hidden="true"></div>
        <div class="brand-row">
          <a class="brand" href="index.html?v=2" aria-label="SkillSwap home">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 32 32" fill="none">
                <path d="M8 11.5 16 7l8 4.5-8 4.6-8-4.6Z" fill="currentColor"/>
                <path d="m8 16 8 4.6 8-4.6M8 20.5l8 4.6 8-4.6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span>skill<span class="brand-accent">swap</span></span>
          </a>
        </div>

        <div class="visual-card">
          <div class="illustration-frame">
            <img src="images/learning-together.jpg" alt="A learner writing in a notebook at a desk surrounded by books and study notes">
          </div>
        </div>

        <div class="visual-copy">
          <span class="eyebrow">A COMMUNITY OF CURIOUS PEOPLE</span>
          <h1 id="visual-title">Learn together.<br>Grow together.</h1>
          <p>Exchange practical skills, share real experience, and build momentum with people who love to learn.</p>
        </div>
      </section>

      <section class="login-panel" aria-labelledby="login-title">
        <div class="login-card">
          <div class="login-topbar">
            <span class="login-mode">
              <span class="status-dot" aria-hidden="true"></span>
              <span>SkillSwap account</span>
            </span>
            <a class="home-link" href="index.html?v=2">Back to homepage</a>
          </div>

          <div class="login-header">
            <p class="welcome-kicker">Welcome back</p>
            <h2 id="login-title">Log in to SkillSwap</h2>
          </div>

          <form id="loginForm" novalidate>
            <div class="field-group">
              <label for="email">Email address</label>
              <div class="input-wrap">
                <span class="input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none">
                    <path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v9A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-9Zm2.3.8 5.7 4.1 5.7-4.1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </span>
                <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" aria-invalid="false" aria-describedby="emailError">
              </div>
              <p class="field-error" id="emailError" aria-live="polite"></p>
            </div>

            <div class="field-group">
              <label for="password">Password</label>
              <div class="input-wrap">
                <span class="input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none">
                    <path d="M7 10V8a5 5 0 1 1 10 0v2M6.5 10h11a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-11a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </span>
                <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" aria-invalid="false" aria-describedby="passwordError">
                <button class="toggle-password" id="togglePassword" type="button" aria-controls="password" aria-pressed="false" aria-label="Show password">Show</button>
              </div>
              <p class="field-error" id="passwordError" aria-live="polite"></p>
            </div>

            <button class="login-button" id="loginSubmit" type="submit">Continue</button>
            <p class="form-status" id="formStatus" role="alert" aria-live="polite"></p>
          </form>
          <p class="auth-switch">New to SkillSwap? <a href="register.html?v=1">Create an account</a></p>
        </div>
      </section>
    </main>
  </body>
</html>
